[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "arc-ocr-proofread"
version = "1.1.1"
description = "Durable PDF-vision proofreading of page-mapped OCR for ARC."
readme = "README.md"
license = "MIT"
authors = [{ name = "ARC" }]
requires-python = ">=3.11"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
]
dependencies = [
  "arc-jobs>=1.1,<1.2",
  "arc-llm>=1.1,<1.2",
  "arc-document>=1.1,<1.2",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
arc-ocr-proofread = "arc_ocr_proofread.cli:main"

[project.urls]
Homepage = "https://github.com/tririver/arc"
Repository = "https://github.com/tririver/arc"
Issues = "https://github.com/tririver/arc/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/arc_ocr_proofread"]
