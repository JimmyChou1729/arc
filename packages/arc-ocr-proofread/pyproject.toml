[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "arc-ocr-proofread"
version = "1.0.4"
description = "Durable PDF-vision proofreading of page-mapped OCR for ARC."
readme = "README.md"
license = "MIT"
authors = [{ name = "ARC" }]
requires-python = ">=3.11"
dependencies = [
  "arc-jobs>=1.0,<1.1",
  "arc-llm>=1.0,<1.1",
  "arc-paper>=1.0,<1.1",
]

[project.optional-dependencies]
test = ["pytest>=8.0"]

[project.scripts]
arc-ocr-proofread = "arc_ocr_proofread.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/arc_ocr_proofread"]
