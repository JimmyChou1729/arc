name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      run_network:
        description: Run real paper-network integration tests
        type: boolean
        default: false

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      AC_FOUNDATION_REPO_ROOT: ${{ github.workspace }}/local/ac-foundation
      ARC_REQUIRE_DSH_TESTS: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: python -m pip install build pytest PyYAML Pillow uv
      - name: Read Foundation source lock
        id: foundation
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          lock = json.loads(Path("plugins/arc/skills/arc/scripts/runtime-sources.json").read_text())
          source = next(item for item in lock["sources"] if item["id"] == "foundation")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print("repository=" + source["repository"], file=output)
              print("sha=" + source["commit"], file=output)
          PY
      - name: Checkout locked Foundation
        env:
          FOUNDATION_REPOSITORY: ${{ steps.foundation.outputs.repository }}
          FOUNDATION_SHA: ${{ steps.foundation.outputs.sha }}
        run: |
          git clone "$FOUNDATION_REPOSITORY" local/ac-foundation
          git -C local/ac-foundation checkout --detach "$FOUNDATION_SHA"
      - run: python scripts/check-generated-foundation.py
      - run: >-
          python -m pip install
          -e local/ac-foundation/packages/ac-jobs
          -e local/ac-foundation/packages/ac-llm
          -e local/ac-foundation/packages/ac-document
          -e local/ac-foundation/packages/ac-proposer-reviewer
          -e packages/arc-paper
          -e packages/arc-domain
      - name: Locked Foundation runtime and Host contracts on Linux
        run: >-
          python -m pytest --import-mode=importlib
          local/ac-foundation/tests/test_runtime_bootstrap.py
          local/ac-foundation/tests/test_runtime_recovery.py
          local/ac-foundation/packages/ac-llm/tests/test_host_provider.py
          local/ac-foundation/packages/ac-jobs/tests/test_installation.py
          --basetemp "$RUNNER_TEMP/ac-runtime-recovery" -q -ra
      - name: Offline suite
        run: python -m pytest --import-mode=importlib packages/*/tests tests -ra
      - name: Explicit live paper-network checks
        if: github.event_name == 'workflow_dispatch' && inputs.run_network
        env:
          ARC_RUN_NET_TESTS: "1"
        run: python -m pytest tests/integration/test_paper_query_network.py -v -ra
      - run: node tests/test_dsh_llm_bridge.mjs
      - run: scripts/build-packages.sh

  fresh-plugin:
    name: Cold ZIP / ${{ matrix.report-profile }} TeX
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        report-profile: [system, owned]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install jsonschema PyYAML Pillow uv
      - name: Initialize the supported report system profile
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends pandoc fontconfig poppler-utils perl
          if [ "${{ matrix.report-profile }}" = system ]; then
            sudo apt-get install -y --no-install-recommends texlive-xetex texlive-lang-chinese texlive-latex-extra texlive-fonts-recommended lmodern
          fi
      - name: Build the actual public skills ZIP
        run: python scripts/plugin_bundle.py build --profile public-skills --output "$RUNNER_TEMP/arc.zip"
      - name: Verify cold Git installation, protocol, scientific environment and real PDF
        env:
          XDG_CACHE_HOME: /sys/ac-runtime-unwritable-cache
        run: |
          extra=()
          if [ "${{ matrix.report-profile }}" = owned ]; then extra+=(--owned-tex); fi
          python scripts/verify-fresh-plugin.py --zip "$RUNNER_TEMP/arc.zip" --output-dir "$RUNNER_TEMP/arc-fresh" --report --scientific --verify-private-cache "${extra[@]}"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fresh-plugin-verification-${{ matrix.report-profile }}
          path: |
            ${{ runner.temp }}/arc-fresh/verification.json
            ${{ runner.temp }}/arc-fresh/*.stdout
            ${{ runner.temp }}/arc-fresh/*.stderr
            ${{ runner.temp }}/arc-fresh/report-proof/report-verification.pdf
            ${{ runner.temp }}/arc-fresh/report-proof/page-*.png
            ${{ runner.temp }}/arc-fresh/report-tex/arc-tex-install.json
            ${{ runner.temp }}/arc-fresh/.report-tex.ac-install/state.json
            ${{ runner.temp }}/arc-fresh/.report-tex.ac-install/attempts/*/state.json
            ${{ runner.temp }}/arc-fresh/.report-tex.ac-install/attempts/*/events/*.json
            ${{ runner.temp }}/arc-fresh/.report-tex.ac-install/attempts/*/commands/*/*.json
            ${{ runner.temp }}/arc-fresh/.report-tex.ac-install/attempts/*/commands/*/*.log
            ${{ runner.temp }}/arc-fresh/runtimes/**/attempts/*/install.log
            ${{ runner.temp }}/arc-fresh/runtimes/**/attempts/*/state.json
          include-hidden-files: true
